<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; /* Slate 900 */
      color: #f1f5f9; /* Slate 100 */
      margin: 0;
      padding: 16px;
    }
    h3 {
      margin-top: 0;
      color: #ffffff;
      font-size: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background-color: #1e293b; /* Slate 800 */
      border: 1px solid #475569;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }
    input:focus {
      border-color: #ef4444; /* Red 500 */
    }
    button {
      width: 100%;
      background-color: #dc2626; /* Red 600 */
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #ef4444;
    }
    button:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
    #result-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      font-weight: 500;
    }
    .status-safe {
      background-color: rgba(6, 78, 59, 0.4);
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
    .status-warning {
      background-color: rgba(127, 29, 29, 0.4);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .status-pending {
      background-color: #1e293b;
      border: 1px dashed #94a3b8;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h3>🛡️ Gateway Quick Scan</h3>
  
  <div class="form-group">
    <input type="text" id="url-input" placeholder="Paste link here to check..." />
  </div>
  
  <button id="scan-btn">Scan URL Shortcut</button>
  
  <div id="result-box"></div>

  <script src="popup.js"></script>
</body>
</html>
